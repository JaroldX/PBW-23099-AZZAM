<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruity</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
          <a class="navbar-brand" href="#">
            <i></i> Ghost
          </a>
          <button aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-target="#navbarNav" data-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contact Me</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

    <div class="container my-5">
        <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title text-primary">Contact Me</h2>
            <p class="card-text text-muted">If you need help, please contact us via the form below</p>
            <form>
            <div class="form-group">
                <label for="email">Email</label>
                <input class="form-control" id="email" type="email">
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                <label for="first-name">First Name</label>
                <input class="form-control" id="first-name" type="text">
                </div>
                <div class="form-group col-md-6">
                <label for="last-name">Last Name</label>
                <input class="form-control" id="last-name" type="text">
                </div>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea class="form-control" id="message" rows="4"></textarea>
            </div>
            <div class="form-group form-check">
                <input class="form-check-input" id="terms" type="checkbox">
                <label class="form-check-label" for="terms">I agree to the terms and conditions</label>
            </div>
            <button class="btn btn-primary" type="submit">Send</button>
            </form>
        </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
